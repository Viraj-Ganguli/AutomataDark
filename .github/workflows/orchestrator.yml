# Agent Orchestrator
#
# Drives a human-filed NLSpec issue (.github/ISSUE_TEMPLATE/nlspec.md) through
# QA -> Coder -> Review -> PR, with every agent call routed through
# OpenRouter.
#
# Trigger: a repo collaborator applies the configured label (see
# .factory/orchestrator.config.json, default "build") to an NLSpec issue, or a
# maintainer manually dispatches this workflow for a given issue number.
#
# Tuning (harness, model, max-turns, attempts, autoMerge, the trigger label)
# lives in .factory/orchestrator.config.json, not in this file. Every stage
# runs through .factory/scripts/run-agent.sh, which installs the configured
# harness (claude-code, opencode, or codex) and points it at OpenRouter. See
# README.md for setup (`.factory/factory.sh setup`) and configuration.
#
# Three zones, kept apart on purpose (see README "Factory vs. product"):
#   factory     .factory/, .github/ -- the pipeline definition; agents never edit it
#   product     paths in config .paths.<stage> -- the only thing committed/PR'd
#   run record  prompts, agent logs, ambiguity notes, scores -- uploaded as
#               the run-<stage> artifacts and summarized in the PR body;
#               never committed
#
# Agent jobs check out with persist-credentials: false, so the agent has no
# push credentials -- only the workflow's own commit steps push, after
# .factory/scripts/check-paths.sh has passed.
#
# Every gate decision (write scope, red check, rubric score) is made by the
# Lean `factory` binary in .factory/lean, whose decision functions are proved
# correct there. The setup job builds it from main (the build fails on any
# unproved theorem) and each agent job copies it into its snapshot before the
# agent runs. `factory workflow` checks this file still matches the Pipeline
# model the theorems are about -- run .factory/factory.sh verify after editing.
#
# Nothing here assumes a language or test framework: product commands come
# from the "product" block of the config, via .factory/scripts/product.sh.

name: Agent Orchestrator

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "NLSpec issue number to build"
        required: true
        type: number
      harness:
        description: "Harness for every stage of this run (config = use .factory/orchestrator.config.json)"
        required: false
        type: choice
        default: config
        options: [config, claude-code, opencode, codex]
      model:
        description: "OpenRouter model slug for every stage of this run, e.g. ~anthropic/claude-opus-latest. Empty = use the config file."
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write

# One build per issue at a time; a second label/dispatch queues behind it.
concurrency:
  group: orchestrator-issue-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

env:
  # Run record for the current job (see header). Uploaded as run-<stage>.
  FACTORY_RUN_DIR: /tmp/factory-run
  # Agent jobs snapshot .factory/scripts + config here *before* the agent
  # runs, and every later step uses the snapshot -- so an agent that edits
  # check-paths.sh or the config in its working tree can't change the rules
  # it's judged by.
  FACTORY_SCRIPTS: /tmp/factory-scripts
  # Where product.testReport writes its JUnit XML (read by `factory red`).
  FACTORY_JUNIT: /tmp/factory-junit.xml
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ---------------------------------------------------------------------
  # guard: decide whether this event should start a build, and for which
  # issue; then validate every stage's model slug against OpenRouter so a
  # typo fails in seconds, not after QA has spent credits.
  # ---------------------------------------------------------------------
  guard:
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
      issue_number: ${{ steps.check.outputs.issue_number }}
      model_override: ${{ steps.check.outputs.model_override }}
      harness_override: ${{ steps.check.outputs.harness_override }}
      key_limit: ${{ steps.preflight.outputs.key_limit }}
      key_ttl: ${{ steps.preflight.outputs.key_ttl }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Evaluate trigger
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_LABEL: ${{ github.event.label.name }}
          EVENT_SENDER: ${{ github.event.sender.login }}
          EVENT_ISSUE_NUMBER: ${{ github.event.issue.number }}
          DISPATCH_ISSUE_NUMBER: ${{ inputs.issue_number }}
          DISPATCH_MODEL: ${{ inputs.model }}
          DISPATCH_HARNESS: ${{ inputs.harness }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          CONFIG_LABEL=$(jq -r '.label // "build"' .factory/orchestrator.config.json)

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Manually dispatched for issue #$DISPATCH_ISSUE_NUMBER."
            [ "$DISPATCH_HARNESS" = "config" ] && DISPATCH_HARNESS=""
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            echo "issue_number=$DISPATCH_ISSUE_NUMBER" >> "$GITHUB_OUTPUT"
            echo "model_override=$DISPATCH_MODEL" >> "$GITHUB_OUTPUT"
            echo "harness_override=$DISPATCH_HARNESS" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$EVENT_LABEL" != "$CONFIG_LABEL" ]; then
            echo "Label '$EVENT_LABEL' is not the configured build label ('$CONFIG_LABEL'); skipping."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if gh api "repos/$REPO/collaborators/$EVENT_SENDER" --silent; then
            echo "$EVENT_SENDER is a collaborator; proceeding."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            echo "issue_number=$EVENT_ISSUE_NUMBER" >> "$GITHUB_OUTPUT"
            echo "model_override=" >> "$GITHUB_OUTPUT"
            echo "harness_override=" >> "$GITHUB_OUTPUT"
          else
            echo "$EVENT_SENDER is not a collaborator; skipping."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Preflight -- model slugs
        id: preflight
        if: steps.check.outputs.proceed == 'true'
        env:
          STAGE_OVERRIDE_MODEL: ${{ steps.check.outputs.model_override }}
          STAGE_OVERRIDE_HARNESS: ${{ steps.check.outputs.harness_override }}
        run: |
          set -euo pipefail
          echo "key_limit=$(jq -r '.runKey.limitUsd // 5' .factory/orchestrator.config.json)" >> "$GITHUB_OUTPUT"
          echo "key_ttl=$(jq -r '.runKey.ttlMinutes // 180' .factory/orchestrator.config.json)" >> "$GITHUB_OUTPUT"
          echo "### Resolved stage configuration" >> "$GITHUB_STEP_SUMMARY"
          for stage in qa coder review; do
            bash .factory/scripts/run-agent.sh --check "$stage"
            echo "- $(bash .factory/scripts/run-agent.sh --resolve "$stage")" >> "$GITHUB_STEP_SUMMARY"
          done

  # ---------------------------------------------------------------------
  # mint-key: create this build's throwaway OpenRouter key (capped at
  # runKey.limitUsd, expiring after runKey.ttlMinutes) from the management
  # key. See run-key.yml for why this is the only place that key exists.
  # Agent jobs get the run key encrypted; revoke-key deletes it at the end.
  # ---------------------------------------------------------------------
  mint-key:
    needs: [guard]
    if: needs.guard.outputs.proceed == 'true'
    permissions: {}
    uses: ./.github/workflows/run-key.yml
    secrets: inherit
    with:
      mode: mint
      limit_usd: ${{ needs.guard.outputs.key_limit }}
      ttl_minutes: ${{ needs.guard.outputs.key_ttl }}

  # ---------------------------------------------------------------------
  # setup: build the gate binary from main, make sure the pipeline's labels
  # exist, create (or reuse) the per-issue feature branch, and announce the
  # run on the issue.
  # ---------------------------------------------------------------------
  setup:
    needs: [guard]
    if: needs.guard.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.branch.outputs.branch }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Build factory gates (Lean; fails on any unproved theorem)
        id: factory-bin
        uses: ./.github/actions/factory-bin

      - name: Upload factory gates
        uses: actions/upload-artifact@v4
        with:
          name: factory-bin
          path: ${{ steps.factory-bin.outputs.path }}
          if-no-files-found: error
          retention-days: 1

      - name: Ensure pipeline labels exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for l in agent:qa-done agent:coder-done agent:review-done agent:pr-open agent:merged agent:failed; do
            gh label create "$l" --color ededed --force >/dev/null
          done

      - name: Derive branch name
        id: branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ needs.guard.outputs.issue_number }}
        run: |
          set -euo pipefail
          TITLE=$(gh issue view "$ISSUE_NUMBER" --json title --jq .title)
          SLUG=$(echo "$TITLE" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/\[nlspec\]//g; s/[^a-z0-9]+/-/g; s/^-+|-+$//g' \
            | cut -c1-40)
          SLUG=${SLUG:-issue}
          BRANCH="agent/issue-${ISSUE_NUMBER}-${SLUG}"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Create or reuse feature branch
        env:
          BRANCH: ${{ steps.branch.outputs.branch }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "Branch $BRANCH already exists on origin; reusing it."
          else
            git checkout -b "$BRANCH"
            git push -u origin "$BRANCH"
          fi

      - name: Announce build start on issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ needs.guard.outputs.issue_number }}
          BRANCH: ${{ steps.branch.outputs.branch }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh issue comment "$ISSUE_NUMBER" --body "Build started on branch \`$BRANCH\`. [Follow the run]($RUN_URL)."

  # ---------------------------------------------------------------------
  # qa: the agent writes failing tests (inside .paths.qa) for the issue's
  # Acceptance Criteria, using the protected paths as the shared harness.
  # ---------------------------------------------------------------------
  qa:
    needs: [guard, mint-key, setup]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.setup.outputs.branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch factory gates
        uses: actions/download-artifact@v4
        with:
          name: factory-bin
          path: ${{ env.FACTORY_SCRIPTS }}

      - name: Snapshot factory scripts (before any agent runs)
        run: |
          set -euo pipefail
          mkdir -p "$FACTORY_SCRIPTS"
          cp .factory/scripts/*.sh .factory/orchestrator.config.json "$FACTORY_SCRIPTS/"
          chmod +x "$FACTORY_SCRIPTS/factory"
          echo "ORCHESTRATOR_CONFIG=$FACTORY_SCRIPTS/orchestrator.config.json" >> "$GITHUB_ENV"
          echo "TEST_CMD=$(bash "$FACTORY_SCRIPTS"/product.sh show test)" >> "$GITHUB_ENV"
          echo "TEST_TOOL=$(bash "$FACTORY_SCRIPTS"/product.sh tool-pattern)" >> "$GITHUB_ENV"

      - name: Set up product
        uses: ./.github/actions/setup-product
        with:
          scripts: ${{ env.FACTORY_SCRIPTS }}

      - name: Assemble QA prompt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ needs.guard.outputs.issue_number }}
        run: |
          set -euo pipefail
          echo "BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          {
            cat .factory/qa.nlspec.md
            echo
            echo "---"
            echo
            echo "## GitHub issue #$ISSUE_NUMBER"
            echo
            gh issue view "$ISSUE_NUMBER" --json title,body --jq '"# " + .title + "\n\n" + .body'
            echo
            echo "---"
            echo
            echo "The shared, read-only test harness lives under: $(jq -r '.paths.protected | map("`" + . + "`") | join(", ")' "$ORCHESTRATOR_CONFIG"). Read its README, if it has one, for the interface."
            echo
            echo "---"
            echo
            bash "$FACTORY_SCRIPTS"/check-paths.sh --describe qa
            echo
            echo "---"
            echo
            echo "## Action required"
            echo
            echo "Write the failing tests for issue #$ISSUE_NUMBER right now."
            echo "Use your Write or Edit tools to create test file(s) inside your write scope."
            echo "Do NOT describe what you will do — call the tools and write the files."
            echo "When done, run \`$TEST_CMD\` to confirm the new tests fail for the right reason."
          } > "$RUNNER_TEMP/qa-prompt.md"

      - name: Run QA agent
        timeout-minutes: 20
        env:
          OPENROUTER_KEY_CIPHER: ${{ needs.mint-key.outputs.key_cipher }}
          FACTORY_KEY_PASSPHRASE: ${{ secrets.FACTORY_KEY_PASSPHRASE }}
          STAGE_OVERRIDE_MODEL: ${{ needs.guard.outputs.model_override }}
          STAGE_OVERRIDE_HARNESS: ${{ needs.guard.outputs.harness_override }}
        run: >-
          bash "$FACTORY_SCRIPTS"/run-agent.sh qa "$RUNNER_TEMP/qa-prompt.md"
          "Read,Write,Edit,Glob,Grep,$TEST_TOOL,Bash(git status*),Bash(git diff*),Bash(git log*)"

      - name: Enforce QA write scope (factory/product boundary)
        run: bash "$FACTORY_SCRIPTS"/check-paths.sh qa "$BASE_SHA" "$FACTORY_RUN_DIR"

      - name: Run test suite (expect red, for the right reason)
        run: |
          set -uo pipefail
          STRICT=$(jq -r 'if .strictRedCheck == false then "false" else "true" end' "$ORCHESTRATOR_CONFIG")

          if [ "$STRICT" = "true" ]; then
            bash "$FACTORY_SCRIPTS"/product.sh test-report
            STATUS=$?
          else
            bash "$FACTORY_SCRIPTS"/product.sh test
            STATUS=$?
          fi

          if [ "$STATUS" -eq 0 ]; then
            echo "Test suite is green before the coder agent has run -- QA tests aren't red."
            exit 1
          fi
          echo "Test suite is red (exit $STATUS)."

          if [ "$STRICT" = "true" ]; then
            "$FACTORY_SCRIPTS"/factory red "$FACTORY_JUNIT" "$FACTORY_RUN_DIR/changed-qa.txt"
          fi

      - name: Commit and push QA tests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ needs.guard.outputs.issue_number }}
          BRANCH: ${{ needs.setup.outputs.branch }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --cached --quiet || git -c core.hooksPath=/dev/null commit -m "test: add failing tests for issue #$ISSUE_NUMBER (QA agent)"
          git push --no-verify "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "HEAD:refs/heads/${BRANCH}"

      - name: Label issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ needs.guard.outputs.issue_number }}
        run: gh issue edit "$ISSUE_NUMBER" --add-label "agent:qa-done"

      - name: Scrub run record
        if: always()
        env:
          SCRUB_EXTRA: ${{ secrets.FACTORY_KEY_PASSPHRASE }}
        run: bash "$FACTORY_SCRIPTS"/scrub.sh "$FACTORY_RUN_DIR"/* || true

      - name: Upload run record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-qa
          # Named files only: anything else an agent drops in the run dir
          # is not published.
          path: |
            ${{ env.FACTORY_RUN_DIR }}/prompts-*.md
            ${{ env.FACTORY_RUN_DIR }}/agent-*.log
            ${{ env.FACTORY_RUN_DIR }}/ambiguities-*.md
            ${{ env.FACTORY_RUN_DIR }}/changed-*.txt
            ${{ env.FACTORY_RUN_DIR }}/review-*.json
            ${{ env.FACTORY_RUN_DIR }}/review-report.md
          if-no-files-found: ignore
          overwrite: true

  # ---------------------------------------------------------------------
  # coder: the agent edits the product (inside .paths.coder) until the QA
  # agent's tests (and the rest of the suite) pass. If the suite is still red after
  # an attempt, the failing output is fed back and the agent goes again, up
  # to stages.coder.maxAttempts.
  # ---------------------------------------------------------------------
  coder:
    needs: [guard, mint-key, setup, qa]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.setup.outputs.branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch factory gates
        uses: actions/download-artifact@v4
        with:
          name: factory-bin
          path: ${{ env.FACTORY_SCRIPTS }}

      - name: Snapshot factory scripts (before any agent runs)
        run: |
          set -euo pipefail
          mkdir -p "$FACTORY_SCRIPTS"
          cp .factory/scripts/*.sh .factory/orchestrator.config.json "$FACTORY_SCRIPTS/"
          chmod +x "$FACTORY_SCRIPTS/factory"
          echo "ORCHESTRATOR_CONFIG=$FACTORY_SCRIPTS/orchestrator.config.json" >> "$GITHUB_ENV"
          echo "TEST_CMD=$(bash "$FACTORY_SCRIPTS"/product.sh show test)" >> "$GITHUB_ENV"
          echo "TEST_TOOL=$(bash "$FACTORY_SCRIPTS"/product.sh tool-pattern)" >> "$GITHUB_ENV"

      - name: Set up product
        uses: ./.github/actions/setup-product
        with:
          scripts: ${{ env.FACTORY_SCRIPTS }}

      - name: Fetch QA run record
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: run-qa
          path: ${{ runner.temp }}/qa-record

      - name: Assemble coder prompt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ needs.guard.outputs.issue_number }}
        run: |
          set -euo pipefail
          echo "BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          {
            cat .factory/coder.nlspec.md
            echo
            echo "---"
            echo
            bash "$FACTORY_SCRIPTS"/check-paths.sh --describe coder
            echo
            echo "---"
            if [ -s "$RUNNER_TEMP/qa-record/ambiguities-qa.md" ]; then
              echo
              echo "## Open questions the QA agent recorded"
              echo
              echo "These are unresolved. Don't guess past them silently; if one blocks you, append to the checklist too."
              echo
              cat "$RUNNER_TEMP/qa-record/ambiguities-qa.md"
              echo
              echo "---"
            fi
            echo
            echo "## GitHub issue #$ISSUE_NUMBER"
            echo
            gh issue view "$ISSUE_NUMBER" --json title,body --jq '"# " + .title + "\n\n" + .body'
            echo
            echo "---"
            echo
            echo "## Failing tests"
            echo
            echo "The QA agent already committed failing tests. Run \`$TEST_CMD\` to see the current failures, then iterate (read -> edit -> re-run) until it exits 0. Do not edit the tests or anything else outside your write scope."
            echo
            echo "---"
            echo
            echo "## Action required"
            echo
            echo "Start now: run \`$TEST_CMD\`, read the failures, edit the application source, and repeat until green."
            echo "Do NOT describe what you will do — call the tools and fix the code."
          } > "$RUNNER_TEMP/coder-prompt.base.md"

      - name: Run coder agent (with repair attempts)
        timeout-minutes: 45
        env:
          OPENROUTER_KEY_CIPHER: ${{ needs.mint-key.outputs.key_cipher }}
          FACTORY_KEY_PASSPHRASE: ${{ secrets.FACTORY_KEY_PASSPHRASE }}
          STAGE_OVERRIDE_MODEL: ${{ needs.guard.outputs.model_override }}
          STAGE_OVERRIDE_HARNESS: ${{ needs.guard.outputs.harness_override }}
        run: |
          set -uo pipefail
          ATTEMPTS=$(bash "$FACTORY_SCRIPTS"/run-agent.sh --get coder maxAttempts)
          PROMPT="$RUNNER_TEMP/coder-prompt.md"
          cp "$RUNNER_TEMP/coder-prompt.base.md" "$PROMPT"

          for i in $(seq 1 "$ATTEMPTS"); do
            echo "::group::Coder attempt $i of $ATTEMPTS"
            bash "$FACTORY_SCRIPTS"/run-agent.sh coder "$PROMPT" \
              "Read,Write,Edit,Glob,Grep,$TEST_TOOL,Bash(git status*),Bash(git diff*),Bash(git log*)" \
              || echo "Agent exited non-zero on attempt $i; checking the suite anyway."
            echo "::endgroup::"

            # Agent-written code runs here; product.sh keeps the key material out of its env.
            if bash "$FACTORY_SCRIPTS"/product.sh test > "$RUNNER_TEMP/test-output.txt" 2>&1; then
              echo "Suite is green after attempt $i."
              exit 0
            fi
            echo "Suite still red after attempt $i."

            if [ "$i" -lt "$ATTEMPTS" ]; then
              {
                cat "$RUNNER_TEMP/coder-prompt.base.md"
                echo
                echo "---"
                echo
                echo "## Previous attempt $i left the suite red"
                echo
                echo "Your earlier edits are still in the working tree. This is the tail of \`$TEST_CMD\`:"
                echo
                echo '```'
                tail -c 8000 "$RUNNER_TEMP/test-output.txt"
                echo '```'
                echo
                echo "Fix the remaining failures in application code. Do not edit the tests; if a test is unsatisfiable, record it in .factory/ambiguity-checklist.md."
              } > "$PROMPT"
            fi
          done
          tail -c 8000 "$RUNNER_TEMP/test-output.txt"
          echo "::error::Suite still red after $ATTEMPTS coder attempt(s)."
          exit 1

      - name: Enforce coder write scope (factory/product boundary)
        run: bash "$FACTORY_SCRIPTS"/check-paths.sh coder "$BASE_SHA" "$FACTORY_RUN_DIR"

      - name: Run test suite (must be green)
        run: bash "$FACTORY_SCRIPTS"/product.sh test

      - name: Commit and push coder changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ needs.guard.outputs.issue_number }}
          BRANCH: ${{ needs.setup.outputs.branch }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --cached --quiet || git -c core.hooksPath=/dev/null commit -m "feat: implement issue #$ISSUE_NUMBER (coder agent)"
          git push --no-verify "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "HEAD:refs/heads/${BRANCH}"

      - name: Label issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ needs.guard.outputs.issue_number }}
        run: gh issue edit "$ISSUE_NUMBER" --add-label "agent:coder-done"

      - name: Scrub run record
        if: always()
        env:
          SCRUB_EXTRA: ${{ secrets.FACTORY_KEY_PASSPHRASE }}
        run: bash "$FACTORY_SCRIPTS"/scrub.sh "$FACTORY_RUN_DIR"/* || true

      - name: Upload run record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-coder
          # Named files only: anything else an agent drops in the run dir
          # is not published.
          path: |
            ${{ env.FACTORY_RUN_DIR }}/prompts-*.md
            ${{ env.FACTORY_RUN_DIR }}/agent-*.log
            ${{ env.FACTORY_RUN_DIR }}/ambiguities-*.md
            ${{ env.FACTORY_RUN_DIR }}/changed-*.txt
            ${{ env.FACTORY_RUN_DIR }}/review-*.json
            ${{ env.FACTORY_RUN_DIR }}/review-report.md
          if-no-files-found: ignore
          overwrite: true

  # ---------------------------------------------------------------------
  # review: the agent scores the cumulative diff against .factory/rubric.json.
  # `factory score` computes the weighted pass/fail in exact arithmetic.
  # ---------------------------------------------------------------------
  review:
    needs: [guard, mint-key, setup, qa, coder]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    outputs:
      overall: ${{ steps.score.outputs.overall }}
      pass: ${{ steps.score.outputs.pass }}
      dim_security: ${{ steps.score.outputs.dim_security }}
      dim_architecture: ${{ steps.score.outputs.dim_architecture }}
      dim_style: ${{ steps.score.outputs.dim_style }}
      report_b64: ${{ steps.score.outputs.report_b64 }}
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.setup.outputs.branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch factory gates
        uses: actions/download-artifact@v4
        with:
          name: factory-bin
          path: ${{ env.FACTORY_SCRIPTS }}

      - name: Snapshot factory scripts (before any agent runs)
        run: |
          set -euo pipefail
          mkdir -p "$FACTORY_SCRIPTS"
          cp .factory/scripts/*.sh .factory/orchestrator.config.json "$FACTORY_SCRIPTS/"
          chmod +x "$FACTORY_SCRIPTS/factory"
          echo "ORCHESTRATOR_CONFIG=$FACTORY_SCRIPTS/orchestrator.config.json" >> "$GITHUB_ENV"
          echo "TEST_CMD=$(bash "$FACTORY_SCRIPTS"/product.sh show test)" >> "$GITHUB_ENV"
          echo "TEST_TOOL=$(bash "$FACTORY_SCRIPTS"/product.sh tool-pattern)" >> "$GITHUB_ENV"

      - name: Set up product
        uses: ./.github/actions/setup-product
        with:
          scripts: ${{ env.FACTORY_SCRIPTS }}

      - name: Re-run full test suite
        run: bash "$FACTORY_SCRIPTS"/product.sh test

      - name: Compute cumulative diff vs main
        run: |
          set -euo pipefail
          echo "BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git diff --name-only origin/main...HEAD > "$RUNNER_TEMP/changed-files.txt"
          # Lockfiles are noise for a rubric review and can be huge.
          git diff origin/main...HEAD -- . \
            ':(exclude,glob)**/package-lock.json' ':(exclude,glob)**/yarn.lock' ':(exclude,glob)**/pnpm-lock.yaml' \
            ':(exclude,glob)**/poetry.lock' ':(exclude,glob)**/uv.lock' ':(exclude,glob)**/Cargo.lock' \
            ':(exclude,glob)**/go.sum' ':(exclude,glob)**/Gemfile.lock' ':(exclude,glob)**/composer.lock' \
            > "$RUNNER_TEMP/full-diff.txt"
          echo "Changed files since main:"
          cat "$RUNNER_TEMP/changed-files.txt"

          # Protected paths (config .paths.protected) must be untouched across
          # the whole branch, not just per stage.
          while IFS= read -r p; do
            if grep -q "^$p" "$RUNNER_TEMP/changed-files.txt"; then
              echo "Protected path $p was modified on this branch -- failing the review job."
              grep "^$p" "$RUNNER_TEMP/changed-files.txt"
              exit 1
            fi
          done < <(jq -r '.paths.protected // [] | .[]' "$ORCHESTRATOR_CONFIG")

      - name: Assemble review prompt
        env:
          ISSUE_NUMBER: ${{ needs.guard.outputs.issue_number }}
        run: |
          set -euo pipefail
          DIFF_LIMIT=80000
          {
            echo "# Review agent"
            echo
            echo "Score the cumulative diff for issue #$ISSUE_NUMBER (changes since"
            echo "main, listed and shown below) against every criterion in the rubric"
            echo "below. For each criterion, give an integer score from 0 to 100 and a one-sentence"
            echo "comment justifying it."
            echo
            echo "When done, write your results to \`.factory/review-result.json\`"
            echo "(create it -- it does not exist yet) with exactly this shape:"
            echo
            echo '```json'
            echo '{'
            echo '  "criteria": {'
            echo '    "<criterion-id>": { "score": 0-100, "comment": "..." },'
            echo '    "...": { "score": 0-100, "comment": "..." }'
            echo '  }'
            echo '}'
            echo '```'
            echo
            echo "Include every criterion id from the rubric's dimensions[].criteria[].id."
            echo "Do not create, edit, or delete any other file -- in particular, never"
            echo "modify any test or anything under the protected paths."
            echo
            echo "---"
            echo
            echo "## Rubric (.factory/rubric.json)"
            echo
            echo '```json'
            cat .factory/rubric.json
            echo '```'
            echo
            echo "---"
            echo
            echo "## Changed files (vs main)"
            echo
            echo '```'
            cat "$RUNNER_TEMP/changed-files.txt"
            echo '```'
            echo
            echo "---"
            echo
            echo "## Full diff (vs main, lockfiles excluded)"
            echo
            echo '```diff'
            head -c "$DIFF_LIMIT" "$RUNNER_TEMP/full-diff.txt"
            echo '```'
            if [ "$(wc -c < "$RUNNER_TEMP/full-diff.txt")" -gt "$DIFF_LIMIT" ]; then
              echo
              echo "The diff above is truncated at $DIFF_LIMIT bytes. Run \`git diff origin/main...HEAD -- <file>\` for the files it doesn't cover before scoring."
            fi
          } > "$RUNNER_TEMP/review-prompt.md"

      - name: Run review agent
        timeout-minutes: 15
        env:
          OPENROUTER_KEY_CIPHER: ${{ needs.mint-key.outputs.key_cipher }}
          FACTORY_KEY_PASSPHRASE: ${{ secrets.FACTORY_KEY_PASSPHRASE }}
          STAGE_OVERRIDE_MODEL: ${{ needs.guard.outputs.model_override }}
          STAGE_OVERRIDE_HARNESS: ${{ needs.guard.outputs.harness_override }}
        run: >-
          bash "$FACTORY_SCRIPTS"/run-agent.sh review "$RUNNER_TEMP/review-prompt.md"
          "Read,Write,Glob,Grep,Bash(git diff*),Bash(git log*),$TEST_TOOL"

      - name: Enforce review write-scope
        run: |
          set -euo pipefail
          CHANGED=$(git status --porcelain)
          if [ -n "$CHANGED" ] || [ "$(git rev-parse HEAD)" != "$BASE_SHA" ]; then
            echo "Review agent modified the repo (it should only write the gitignored .factory/review-result.json):"
            echo "$CHANGED"
            exit 1
          fi
          if [ ! -f .factory/review-result.json ]; then
            echo "Review agent did not write .factory/review-result.json."
            exit 1
          fi

      - name: Score rubric
        id: score
        run: |
          set -euo pipefail
          "$FACTORY_SCRIPTS"/factory score \
            .factory/rubric.json .factory/review-result.json .factory/review-score.json \
            > "$RUNNER_TEMP/review-report.md"

          OVERALL=$(jq -r '.overall' .factory/review-score.json)
          PASS=$(jq -r '.pass' .factory/review-score.json)
          DIM_SECURITY=$(jq -r '.dimensions.security // 0' .factory/review-score.json)
          DIM_ARCH=$(jq -r '.dimensions.architecture // 0' .factory/review-score.json)
          DIM_STYLE=$(jq -r '.dimensions.style // 0' .factory/review-score.json)

          echo "overall=$OVERALL" >> "$GITHUB_OUTPUT"
          echo "pass=$PASS" >> "$GITHUB_OUTPUT"
          echo "dim_security=$DIM_SECURITY" >> "$GITHUB_OUTPUT"
          echo "dim_architecture=$DIM_ARCH" >> "$GITHUB_OUTPUT"
          echo "dim_style=$DIM_STYLE" >> "$GITHUB_OUTPUT"

          {
            echo "report_b64<<REPORT_EOF"
            base64 < "$RUNNER_TEMP/review-report.md" | tr -d '\n'
            echo
            echo "REPORT_EOF"
          } >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/review-report.md" >> "$GITHUB_STEP_SUMMARY"
          mkdir -p "$FACTORY_RUN_DIR"
          cp .factory/review-result.json .factory/review-score.json "$RUNNER_TEMP/review-report.md" "$FACTORY_RUN_DIR/"

      - name: Scrub review report
        env:
          SCRUB_EXTRA: ${{ secrets.FACTORY_KEY_PASSPHRASE }}
        run: bash "$FACTORY_SCRIPTS"/scrub.sh "$RUNNER_TEMP/review-report.md"

      - name: Post review comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ needs.guard.outputs.issue_number }}
        run: gh issue comment "$ISSUE_NUMBER" --body-file "$RUNNER_TEMP/review-report.md"

      - name: Label issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ needs.guard.outputs.issue_number }}
        run: gh issue edit "$ISSUE_NUMBER" --add-label "agent:review-done"

      - name: Scrub run record
        if: always()
        env:
          SCRUB_EXTRA: ${{ secrets.FACTORY_KEY_PASSPHRASE }}
        run: bash "$FACTORY_SCRIPTS"/scrub.sh "$FACTORY_RUN_DIR"/* || true

      - name: Upload run record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-review
          # Named files only: anything else an agent drops in the run dir
          # is not published.
          path: |
            ${{ env.FACTORY_RUN_DIR }}/prompts-*.md
            ${{ env.FACTORY_RUN_DIR }}/agent-*.log
            ${{ env.FACTORY_RUN_DIR }}/ambiguities-*.md
            ${{ env.FACTORY_RUN_DIR }}/changed-*.txt
            ${{ env.FACTORY_RUN_DIR }}/review-*.json
            ${{ env.FACTORY_RUN_DIR }}/review-report.md
          if-no-files-found: ignore
          overwrite: true

  # ---------------------------------------------------------------------
  # pr: open the gatekeeper PR with the rubric score and any recorded
  # ambiguities injected, and either leave it for human review or
  # auto-merge per .factory/orchestrator.config.json.
  # ---------------------------------------------------------------------
  pr:
    needs: [guard, setup, qa, coder, review]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.setup.outputs.branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch run records
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: run-*
          merge-multiple: true
          path: ${{ env.FACTORY_RUN_DIR }}

      - name: Build PR body
        env:
          STAGE_OVERRIDE_MODEL: ${{ needs.guard.outputs.model_override }}
          STAGE_OVERRIDE_HARNESS: ${{ needs.guard.outputs.harness_override }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ISSUE_NUMBER: ${{ needs.guard.outputs.issue_number }}
          OVERALL: ${{ needs.review.outputs.overall }}
          DIM_SECURITY: ${{ needs.review.outputs.dim_security }}
          DIM_ARCH: ${{ needs.review.outputs.dim_architecture }}
          DIM_STYLE: ${{ needs.review.outputs.dim_style }}
          REPORT_B64: ${{ needs.review.outputs.report_b64 }}
        run: |
          set -euo pipefail
          echo "$REPORT_B64" | base64 -d > "$RUNNER_TEMP/review-report.md"
          AMBIGUITIES=$(cat "$FACTORY_RUN_DIR"/ambiguities-*.md 2>/dev/null || true)

          {
            sed -E \
              -e "s/^Linked issue: #\$/Linked issue: #${ISSUE_NUMBER}/" \
              -e "s/^Score: ___.*/Score: ${OVERALL} \/ 100 -- Security: ${DIM_SECURITY} Architecture: ${DIM_ARCH} Style: ${DIM_STYLE}/" \
              .github/PULL_REQUEST_TEMPLATE/gatekeeper.md
            echo
            echo "---"
            echo
            if [ -n "$AMBIGUITIES" ]; then
              echo "## Ambiguities recorded by the agents"
              echo
              echo "The agents hit questions the spec didn't answer. Resolve these before merging:"
              echo
              echo "$AMBIGUITIES"
              echo
              echo "---"
              echo
            fi
            cat "$RUNNER_TEMP/review-report.md"
            echo
            echo "---"
            echo
            echo "<details><summary>Factory run</summary>"
            echo
            echo "This PR contains product changes only. The run record (prompts, raw"
            echo "agent logs, notes, rubric JSON) is attached to the [workflow run]($RUN_URL)"
            echo "as the \`run-qa\`, \`run-coder\`, and \`run-review\` artifacts."
            echo
            for stage in qa coder review; do
              echo "- $(bash .factory/scripts/run-agent.sh --resolve "$stage")"
            done
            echo
            echo "</details>"
            echo
            echo "Closes #${ISSUE_NUMBER}"
          } > "$RUNNER_TEMP/pr-body.md"

      - name: Scrub PR body
        env:
          SCRUB_EXTRA: ${{ secrets.FACTORY_KEY_PASSPHRASE }}
        run: bash .factory/scripts/scrub.sh "$RUNNER_TEMP/pr-body.md"

      - name: Create (or update) pull request
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ needs.guard.outputs.issue_number }}
          BRANCH: ${{ needs.setup.outputs.branch }}
        run: |
          set -euo pipefail
          TITLE=$(gh issue view "$ISSUE_NUMBER" --json title,number \
            --jq '"[Agent] " + .title + " (#" + (.number|tostring) + ")"')
          URL=$(gh pr list --head "$BRANCH" --state open --json url --jq '.[0].url // empty')
          if [ -n "$URL" ]; then
            echo "Re-run: updating existing PR $URL"
            gh pr edit "$URL" --body-file "$RUNNER_TEMP/pr-body.md"
          else
            URL=$(gh pr create --title "$TITLE" --body-file "$RUNNER_TEMP/pr-body.md" --base main --head "$BRANCH")
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "number=$(basename "$URL")" >> "$GITHUB_OUTPUT"

      - name: Merge gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ needs.guard.outputs.issue_number }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          REVIEW_PASS: ${{ needs.review.outputs.pass }}
        run: |
          set -euo pipefail
          AUTO_MERGE=$(jq -r '.autoMerge' .factory/orchestrator.config.json)

          if [ "$AUTO_MERGE" = "true" ] && [ "$REVIEW_PASS" = "true" ]; then
            gh pr merge "$PR_NUMBER" --squash --delete-branch
            gh issue edit "$ISSUE_NUMBER" --add-label "agent:merged"
          else
            gh pr comment "$PR_NUMBER" --body "Build complete. Awaiting human gatekeeper review per the PR template (autoMerge=$AUTO_MERGE, rubric pass=$REVIEW_PASS)."
            gh issue edit "$ISSUE_NUMBER" --add-label "agent:pr-open"
          fi

  # ---------------------------------------------------------------------
  # report-failure: if any agent/enforcement job failed, leave a comment on
  # the issue so a human doesn't have to dig through the Actions tab.
  # ---------------------------------------------------------------------
  report-failure:
    needs: [guard, mint-key, setup, qa, coder, review, pr]
    if: failure() && needs.guard.outputs.issue_number != ''
    runs-on: ubuntu-latest
    steps:
      - name: Comment failure on issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ needs.guard.outputs.issue_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh issue comment "$ISSUE_NUMBER" --body "Build pipeline failed. See the [workflow run]($RUN_URL) for details. No PR was opened. To retry, use **Re-run all jobs** (each build's OpenRouter key is deleted when the build ends, so *Re-run failed jobs* can't work) or re-apply the label."
          gh label create "agent:failed" --color ededed --force >/dev/null || true
          gh issue edit "$ISSUE_NUMBER" --add-label "agent:failed"

  # ---------------------------------------------------------------------
  # revoke-key: delete this build's throwaway key, whatever happened. If
  # this ever fails, the key still expires on its own after ttlMinutes.
  # ---------------------------------------------------------------------
  revoke-key:
    needs: [guard, mint-key, setup, qa, coder, review, pr, report-failure]
    if: always() && needs.mint-key.outputs.key_hash != ''
    permissions: {}
    uses: ./.github/workflows/run-key.yml
    secrets: inherit
    with:
      mode: revoke
      key_hash: ${{ needs.mint-key.outputs.key_hash }}
