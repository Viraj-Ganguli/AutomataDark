# Spine test -- harness/OpenRouter smoke test
#
# Manually-triggered workflow that proves the CI "spine" the real
# orchestrator (.github/workflows/orchestrator.yml) depends on actually
# works in this repo, for a given harness/model combination:
#   - a postgres service container the app can connect to
#   - npm run install:all / npm run migrate / npm test
#   - .factory/scripts/run-agent.sh installing and running the chosen
#     harness against OpenRouter, and editing a file
#
# Unlike the orchestrator, this workflow is meant to stay -- use it whenever
# you add a new harness, change OPENROUTER_API_KEY, or want to sanity-check a
# model slug before putting it in .factory/orchestrator.config.json. Dispatch
# it via the Actions tab, picking a harness and (optionally) a model slug
# native to that harness, then confirm:
#   - the run is green
#   - it pushed a commit to a new agent/spine-test-<run id> branch that adds
#     a one-line comment to server/src/app.js
#   - the OpenRouter activity dashboard (openrouter.ai/activity) shows a
#     request that actually served the model you asked for -- this is the
#     real proof that per-stage model selection works, not just that the run
#     went green

name: Spine Test

on:
  workflow_dispatch:
    inputs:
      harness:
        description: "Harness to smoke-test: claude-code, opencode, or codex. Leave empty to use .factory/orchestrator.config.json's default."
        required: false
        type: string
      model:
        description: "OpenRouter model slug native to the chosen harness (e.g. ~anthropic/claude-sonnet-latest, openai/gpt-5.3-codex). Leave empty to use the config default."
        required: false
        type: string

permissions:
  contents: write

env:
  DATABASE_URL: postgres://factorylab:factorylab@localhost:5432/factorylab
  SESSION_SECRET: ci-spine-test-secret
  NODE_ENV: test

jobs:
  spine:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: factorylab
          POSTGRES_PASSWORD: factorylab
          POSTGRES_DB: factorylab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U factorylab -d factorylab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Create scratch branch
        env:
          BRANCH: agent/spine-test-${{ github.run_id }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json

      - name: Install dependencies
        run: npm run install:all

      - name: Run migrations
        run: npm run migrate

      - name: Assemble prompt
        run: |
          cat > /tmp/spine-prompt.md <<'EOF'
          Add a single-line comment to the top of `server/src/app.js` (just
          below any existing top-of-file comments) describing what the
          module exports. Do not change anything else -- no other files, no
          other lines.
          EOF

      - name: Run agent
        timeout-minutes: 10
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          STAGE_OVERRIDE_HARNESS: ${{ inputs.harness }}
          STAGE_OVERRIDE_MODEL: ${{ inputs.model }}
        run: bash .factory/scripts/run-agent.sh spine /tmp/spine-prompt.md "Read,Write,Edit,Bash(npm test*)"

      - name: Show diff
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --stat
          git diff --cached --name-only

      - name: Run test suite
        run: npm test

      - name: Commit and push
        run: |
          set -euo pipefail
          if git diff --cached --quiet; then
            echo "Agent made no changes -- nothing to commit. Spine still considered green if the steps above succeeded."
            exit 0
          fi
          git commit -m "chore: spine test -- agent edit + green CI"
          git push -u origin "$BRANCH"
          echo "Pushed to branch $BRANCH -- delete it once you've confirmed this run in the OpenRouter dashboard."
