# Spine test -- harness/OpenRouter smoke test
#
# Manually-triggered workflow that proves the CI "spine" the real
# orchestrator (.github/workflows/orchestrator.yml) depends on actually
# works in this repo, for a given harness/model combination:
#   - the product's own setup and test commands (the "product" block of
#     .factory/orchestrator.config.json), if any are configured
#   - .factory/scripts/run-agent.sh installing and running the chosen
#     harness against OpenRouter, and editing a file
#
# Unlike the orchestrator, this workflow is meant to stay -- use it whenever
# you add a new harness, rotate a key, or want to sanity-check a
# model slug before putting it in .factory/orchestrator.config.json. Dispatch
# it via the Actions tab, picking a harness and (optionally) a model slug
# native to that harness, then confirm:
#   - the run is green
#   - it pushed a commit to a new agent/spine-test-<run id> branch that adds
#     a one-line spine-test.txt
#   - the OpenRouter activity dashboard (openrouter.ai/activity) shows a
#     request that actually served the model you asked for -- this is the
#     real proof that per-stage model selection works, not just that the run
#     went green

name: Spine Test

on:
  workflow_dispatch:
    inputs:
      harness:
        description: "Harness to smoke-test (config = use .factory/orchestrator.config.json's default)"
        required: false
        type: choice
        default: config
        options: [config, claude-code, opencode, codex]
      model:
        description: "OpenRouter model slug (e.g. ~anthropic/claude-sonnet-latest, openai/gpt-5.3-codex). Empty = config default."
        required: false
        type: string

permissions:
  contents: write

env:
  FACTORY_RUN_DIR: /tmp/factory-run

jobs:
  # Same throwaway-key flow as the orchestrator: minted here, deleted below.
  mint-key:
    permissions: {}
    uses: ./.github/workflows/run-key.yml
    secrets: inherit
    with:
      mode: mint
      limit_usd: "1"
      ttl_minutes: "60"

  spine:
    needs: [mint-key]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Preflight -- model slug
        env:
          STAGE_OVERRIDE_HARNESS: ${{ inputs.harness }}
          STAGE_OVERRIDE_MODEL: ${{ inputs.model }}
        run: |
          set -euo pipefail
          bash .factory/scripts/run-agent.sh --check spine

      - name: Create scratch branch
        env:
          BRANCH: agent/spine-test-${{ github.run_id }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"

      - name: Set up product (no-op if product.setup is empty)
        uses: ./.github/actions/setup-product

      - name: Assemble prompt
        run: |
          cat > /tmp/spine-prompt.md <<'EOF'
          Create a file named `spine-test.txt` at the repository root
          containing exactly one line: `spine ok`. Do not change anything
          else -- no other files.
          EOF

      - name: Run agent
        timeout-minutes: 10
        env:
          OPENROUTER_KEY_CIPHER: ${{ needs.mint-key.outputs.key_cipher }}
          FACTORY_KEY_PASSPHRASE: ${{ secrets.FACTORY_KEY_PASSPHRASE }}
          STAGE_OVERRIDE_HARNESS: ${{ inputs.harness }}
          STAGE_OVERRIDE_MODEL: ${{ inputs.model }}
        run: bash .factory/scripts/run-agent.sh spine /tmp/spine-prompt.md "Read,Write,Edit"

      - name: Show diff
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --stat
          git diff --cached --name-only

      - name: Run product test suite (if configured)
        run: |
          set -euo pipefail
          if bash .factory/scripts/product.sh configured; then
            bash .factory/scripts/product.sh test
          else
            echo "No product.test configured -- skipping the product suite."
          fi

      - name: Commit and push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if git diff --cached --quiet; then
            echo "Agent made no changes -- nothing to commit. Spine still considered green if the steps above succeeded."
            exit 0
          fi
          git -c core.hooksPath=/dev/null commit -m "chore: spine test -- agent edit + green CI"
          git push --no-verify "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "HEAD:refs/heads/${BRANCH}"
          echo "Pushed to branch $BRANCH -- delete it once you've confirmed this run in the OpenRouter dashboard."

      - name: Scrub run record
        if: always()
        env:
          SCRUB_EXTRA: ${{ secrets.FACTORY_KEY_PASSPHRASE }}
        run: bash .factory/scripts/scrub.sh "$FACTORY_RUN_DIR"/* || true

      - name: Upload run record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-spine
          path: |
            ${{ env.FACTORY_RUN_DIR }}/prompts-*.md
            ${{ env.FACTORY_RUN_DIR }}/agent-*.log
          if-no-files-found: ignore
          overwrite: true

  revoke-key:
    needs: [mint-key, spine]
    if: always() && needs.mint-key.outputs.key_hash != ''
    permissions: {}
    uses: ./.github/workflows/run-key.yml
    secrets: inherit
    with:
      mode: revoke
      key_hash: ${{ needs.mint-key.outputs.key_hash }}
